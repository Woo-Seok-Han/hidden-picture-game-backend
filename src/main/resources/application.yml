server:
  port: ${PORT:3000}

spring:
  application:
    name: hidden-picture-game-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/infection-control-detective}
    driver-class-name: org.h2.Driver
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:1234}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

app:
  upload-dir: ${APP_UPLOAD_DIR:uploads}
  public-base-url: ${APP_PUBLIC_BASE_URL:}
  storage:
    type: ${APP_STORAGE_TYPE:local}
    r2:
      endpoint: ${R2_ENDPOINT:}
      bucket: ${R2_BUCKET:}
      region: ${R2_REGION:auto}
      access-key-id: ${R2_ACCESS_KEY_ID:}
      secret-access-key: ${R2_SECRET_ACCESS_KEY:}
      public-base-url: ${R2_PUBLIC_BASE_URL:}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174,http://localhost:3000}
