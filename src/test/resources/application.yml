spring:
  datasource:
    url: jdbc:h2:mem:hidden-picture-game-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: false

app:
  upload-dir: build/test-uploads
  cors:
    allowed-origins:
      - http://localhost:5173
